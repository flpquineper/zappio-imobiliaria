services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: zappio
      POSTGRES_PASSWORD: zappio
      POSTGRES_DB: zappio
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U zappio']
      interval: 5s
      retries: 10

volumes:
  pgdata:
